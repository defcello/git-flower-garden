name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: git --version
      - run: npm ci
      # Browser tests use the runner's preinstalled Chrome (Edge on Windows);
      # no Playwright browser download is needed.
      - run: npm run check
      # Stage the end-user package, then install it globally, use it, update
      # it, uninstall it, and check that nothing is left behind.
      - run: npm run release:stage
      - run: npm run rehearse:install
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
