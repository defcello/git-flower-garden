name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # vendor/astronomy-engine, pinned and reviewed (ADR 0019).
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: git --version
      - run: npm ci
      # Browser tests use the runner's preinstalled Chrome (Edge on Windows);
      # no Playwright browser download is needed.
      - run: npm run check
      # Stage the end-user package, then install it globally, use it, update
      # it, uninstall it, and check that nothing is left behind.
      - run: npm run release:stage
      - run: npm run rehearse:install
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
