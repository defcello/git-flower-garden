name: release

# Push a version tag (for example v0.2.0-beta.1) to build the end-user
# package, rehearse install/update/uninstall on every OS, and create a DRAFT
# GitHub release with the package attached. Nothing is public until a
# maintainer publishes the draft. Releases are GitHub files only: this
# workflow never publishes to npm (docs/releasing.md).
on:
  push:
    tags: ["v*"]
  # A manual run builds and rehearses the package without releasing it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # vendor/astronomy-engine, pinned and reviewed (ADR 0019).
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run release:stage
      - run: npm run rehearse:install
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package
          path: release/*.tgz
          if-no-files-found: error

  draft:
    needs: rehearse
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: release
      - name: Create a draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          test "$(ls *.tgz | wc -l)" -eq 1
          file="$(ls *.tgz)"
          sha256sum "$file" > SHA256SUMS.txt
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${file}"
          cat > notes.md <<NOTES
          Beta. Requires Node.js 24 or newer and Git 2.36 or newer.

              npm install --global ${url}

          The command is git-flower-garden. To uninstall:
          npm uninstall --global @defcello/git-flower-garden

          See the README and CHANGELOG in the package. SHA-256: SHA256SUMS.txt.
          NOTES
          gh release create "${GITHUB_REF_NAME}" "$file" SHA256SUMS.txt \
            --draft --prerelease --verify-tag \
            --title "git-flower-garden ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
